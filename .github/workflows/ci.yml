name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend (type-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cryptotracker-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cryptotracker-backend/package-lock.json
      - run: npm ci
      - run: npm run build
